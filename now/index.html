<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var k = localStorage.getItem('dlm-motion');
        var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        document.documentElement.dataset.motion = k === 'off' || (k !== 'on' && reduce) ? 'off' : 'on';
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="What David Miller is focused on right now."
    />
    <meta name="theme-color" content="#07080b" />
    <title>Now · David Miller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▮</text></svg>" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/now.ts"></script>
  </body>
</html>
